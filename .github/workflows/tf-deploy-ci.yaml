name: Deploy Infra
 
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tf-plan:
    uses: guilherme-aroliveira/actions-library/.github/workflows/tf-plan.yaml@main
    permissions:
      id-token: write
      contents: read
    with:
      work_dir: './terraform/environment/'
      tf_version: '1.15.9'
      tf_env: 'dev'
    secrets: 
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_BUCKET_KEY: ${{ secrets.AWS_BUCKET_KEY }}
      AWS_ASSUME_ROLE: ${{ secrets.AWS_ASSUME_ROLE }}

  tf-apply:
    needs: tf-plan
    uses: guilherme-aroliveira/actions-library/.github/workflows/tf-apply.yaml@main
    permissions:
      id-token: write
      contents: read
    with:
      work_dir: './terraform/environment/'
      tf_version: '1.15.9'
      tf_env: 'dev'
    secrets: inherit